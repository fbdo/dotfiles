# Enable mouse support (scrolling, clicking panes, resizing)
set -g mouse on

# Enable 24-bit true color support for Helix themes
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Remove escape key delay (crucial for responsive modal editing in Helix)
set -s escape-time 0

# Increase scrollback buffer history
set -g history-limit 10000

# Set prefix to Ctrl-a (optional, easier to reach than Ctrl-b)
# unbind C-b
